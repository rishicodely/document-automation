server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # nginx doesn't know .mjs by default and serves it as octet-stream,
    # which browsers refuse to load as a module. Force the correct type.
    types {
        text/javascript js mjs;
        text/css css;
        text/html html;
        image/svg+xml svg;
        application/wasm wasm;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}