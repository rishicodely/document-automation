services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASS:-postgres}
      POSTGRES_DB: ${DB_NAME:-doc_intake}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres}"]
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    build: ./doc-intake-backend
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_HOST: postgres # service name, not localhost — Docker DNS resolves it
      DB_PORT: 5432
      DB_USER: ${DB_USER:-postgres}
      DB_PASS: ${DB_PASS:-postgres}
      DB_NAME: ${DB_NAME:-doc_intake}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-2024-08-06}
      CONFIDENCE_THRESHOLD: ${CONFIDENCE_THRESHOLD:-0.7}
      MONEY_TOLERANCE: ${MONEY_TOLERANCE:-0.01}
      EXTRACTION_MAX_RETRIES: ${EXTRACTION_MAX_RETRIES:-3}
      UPLOADS_DIR: /data/uploads
      PORT: 3000
    volumes:
      - uploads:/data/uploads # shared with n8n so both see the same files
    ports:
      - "3000:3000"

  review-ui:
    build: ./review-ui
    depends_on:
      - backend
    ports:
      - "5173:80"

  n8n:
    image: n8nio/n8n:latest
    environment:
      N8N_SECURE_COOKIE: "false"
      N8N_RESTRICT_FILE_ACCESS_TO: ""
    volumes:
      - n8ndata:/home/node/.n8n
      - uploads:/data/uploads # same volume the backend uses
    ports:
      - "5678:5678"

volumes:
  pgdata:
  uploads:
  n8ndata:
